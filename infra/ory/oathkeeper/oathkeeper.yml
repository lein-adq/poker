serve:
  proxy:
    port: 4455
    # Exactly one layer may answer CORS, and the API owns it (ASP.NET Core's policy, driven by
    # Cors:AllowedOrigins in appsettings.json). With CORS enabled here as well, every proxied
    # response carried Access-Control-Allow-Origin twice — which browsers reject outright, making
    # the entire authenticated API unreachable from the web app while curl saw nothing wrong.
    #
    # Preflights are therefore forwarded to the API untouched by the poker-cors-preflight access
    # rule, which is why that rule exists at all.
    #
    # Known trade-off: Oathkeeper's own error responses (an expired-session 401, say) carry no CORS
    # headers, so the browser reports those as an opaque network error rather than a clean 401.
    cors:
      enabled: false
  api:
    port: 4456

access_rules:
  matching_strategy: glob
  repositories:
    - file:///etc/config/oathkeeper/access-rules.json

errors:
  fallback:
    - json

authenticators:
  noop:
    enabled: true
  cookie_session:
    enabled: true
    config:
      check_session_url: http://kratos:4433/sessions/whoami
      preserve_path: true
      extra_from: "@this"
      subject_from: "identity.id"
      only:
        - ory_kratos_session

authorizers:
  allow:
    enabled: true

# Used only by the CORS preflight rule: a preflight carries no cookies, so it must skip both session
# checking and identity-header injection, or it would 401 before the API could answer it.
mutators:
  noop:
    enabled: true
  header:
    enabled: true
    config:
      headers:
        X-User-Id: "{{ print .Subject }}"
        X-User-Email: "{{ print .Extra.identity.traits.email }}"
