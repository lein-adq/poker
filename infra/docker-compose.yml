name: poker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: poker
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
    ports: ["5432:5432"]
    volumes: ["poker-db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kratos-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kratos
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: kratos
    volumes: ["kratos-db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailslurper:
    image: oryd/mailslurper:latest-smtps
    ports:
      - "4436:4436" # web UI — view codes/links sent during local dev
      - "4437:4437"
      - "1025:1025"

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    depends_on:
      kratos-db:
        condition: service_healthy
    environment:
      DSN: postgres://kratos:kratos@kratos-db:5432/kratos?sslmode=disable
    volumes:
      - ./ory/kratos:/etc/config/kratos
    command: migrate sql -e --yes

  kratos:
    image: oryd/kratos:v1.3.1
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://kratos:kratos@kratos-db:5432/kratos?sslmode=disable
      COURIER_SMTP_CONNECTION_URI: ${COURIER_SMTP_CONNECTION_URI:-smtps://mailslurper:1025/?skip_ssl_verify=true}
    ports:
      - "4433:4433" # public API
      - "4434:4434" # admin API
    extra_hosts:
      - "api:host-gateway" # Resolves webhook calls to the locally running API
    volumes:
      - ./ory/kratos:/etc/config/kratos
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier

  oathkeeper:
    image: oryd/oathkeeper:v0.40
    depends_on: [kratos]
    ports:
      - "4455:4455" # proxy — the frontend/API entrypoint
      - "4456:4456" # api
    extra_hosts:
      - "api:host-gateway" # Routes 'api' to your host machine when running backend locally
    volumes:
      - ./ory/oathkeeper:/etc/config/oathkeeper
    command: serve -c /etc/config/oathkeeper/oathkeeper.yml

  api:
    profiles: ["app"]
    build:
      context: ../backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=poker;Username=poker;Password=poker"
      ConnectionStrings__Redis: "redis:6379"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    # Deliberately NOT published to the host. OathkeeperAuthenticationHandler trusts X-User-Id and
    # X-User-Email unconditionally, so reaching the API without going through Oathkeeper is a complete
    # authentication bypass: `curl -H 'X-User-Id: anyone' http://localhost:8080/api/wallet/` returned
    # 200 while this port was exposed. Oathkeeper reaches it as http://api:8080 over the compose
    # network, which needs no published port. Use `docker compose exec api` for direct debugging.
    expose: ["8080"]

volumes:
  poker-db-data:
  kratos-db-data:
