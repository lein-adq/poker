name: E2E

# Deliberately not on pull requests. Standing the whole stack up (two Postgres instances, Redis,
# Kratos, Oathkeeper, Mailslurper, the API and the web app) costs minutes and brings browser flake
# onto the critical path to merging. Nightly plus on-demand keeps the signal without that tax.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        working-directory: infra
        run: docker compose up -d --build

      - name: Wait for the stack
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/ || true)
            kratos=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4433/health/ready || true)
            mail=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4437/mail || true)
            # A preflight is proxied through Oathkeeper and answered by the API's own CORS policy, so a
            # 204 here means both of them are actually up — not just that the proxy is listening.
            api=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://localhost:4455/api/tables/ \
              -H 'Origin: http://localhost:5173' -H 'Access-Control-Request-Method: GET' || true)

            if [ "$web" = "200" ] && [ "$kratos" = "200" ] && [ "$mail" = "200" ] && [ "$api" = "204" ]; then
              echo "Stack ready after ${attempt} attempt(s)."
              exit 0
            fi
            echo "waiting… web=$web kratos=$kratos mail=$mail api=$api"
            sleep 5
          done
          echo "::error::The stack did not become ready in time."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install test dependencies
        working-directory: e2e
        run: npm ci

      - name: Install browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # A failing E2E run usually means a service misbehaved, not that a selector moved, so the logs
      # are the first thing anyone will want.
      - name: Container logs
        if: failure()
        working-directory: infra
        run: docker compose logs --no-color --tail=300

      - name: Tear down
        if: always()
        working-directory: infra
        run: docker compose down -v
