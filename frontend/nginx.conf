server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This is a single-page app: any path nginx cannot find on disk is a client-side route, so hand
    # back index.html and let react-router resolve it. Without this, nginx's own 404 wins and every
    # deep link breaks — refreshing on /table/:id, opening a shared table link, or going straight to
    # /auth/register all fail, while the same routes work fine when navigated to from inside the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or clients keep loading a deployment's worth of stale asset URLs.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
